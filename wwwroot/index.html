<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro Kanban - Controle de Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Quadro Kanban</h1>
            <button id="addTaskBtn" class="btn-primary">➕ Nova Tarefa</button>
        </header>

        <main class="kanban-board">
            <div class="column" data-status="0">
                <div class="column-header">
                    <h2>📝 A Fazer</h2>
                    <span class="task-count">0</span>
                </div>
                <div class="tasks" id="todo-tasks"></div>
            </div>

            <div class="column" data-status="1">
                <div class="column-header">
                    <h2>🚀 Em Progresso</h2>
                    <span class="task-count">0</span>
                </div>
                <div class="tasks" id="progress-tasks"></div>
            </div>

            <div class="column" data-status="2">
                <div class="column-header">
                    <h2>✅ Concluído</h2>
                    <span class="task-count">0</span>
                </div>
                <div class="tasks" id="done-tasks"></div>
            </div>
        </main>
    </div>

    <!-- Modal para Adicionar/Editar Tarefa -->
    <div id="taskModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Nova Tarefa</h2>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label for="taskTitle">Título:</label>
                    <input type="text" id="taskTitle" required>
                </div>
                <div class="form-group">
                    <label for="taskDescription">Descrição:</label>
                    <textarea id="taskDescription" rows="4"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Salvar</button>
                    <button type="button" class="btn-secondary" id="cancelBtn">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
